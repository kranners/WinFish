name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # No game assets in CI: build.ps1 compiles and links, skipping the asset copy.
      - name: Build Debug|Win32
        shell: pwsh
        run: ./scripts/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: Insaniquarium-Debug-Win32
          path: |
            Win32/Debug/Insaniquarium.exe
            Win32/Debug/Insaniquarium.pdb
          if-no-files-found: error
